<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Electronics Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#C41E2A;--d:#6B0F18;--bg:#10080A;--cd:#1B0C0F;--ln:rgba(255,255,255,.1);--tx:#F4EAEB;--mt:#B9A0A3;--ac:#FF8A8F;--h:60px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -80px,rgba(196,30,42,.22),transparent),var(--bg);color:var(--tx);font:16px/1.65 Inter,Roboto,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--h);background:var(--d);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:3px solid var(--p)}
.brand{display:flex;align-items:center;gap:12px;color:var(--tx);text-decoration:none;font-weight:600;line-height:1.2;font-size:15px}
.brand small{display:block;font-weight:400;font-size:12px;color:#E6C3C6}
.lg{width:40px;height:40px;border-radius:7%;display:block;flex:none}
.top{margin-left:auto;display:flex;gap:4px}
.top a{color:var(--tx);text-decoration:none;padding:8px 14px;border-radius:6px;font-weight:500;font-size:15px;transition:background .2s}
.top a:hover,.top a.on{background:var(--p)}
#hb{display:none;background:none;border:0;color:var(--tx);font-size:26px;cursor:pointer;padding:0 4px}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto;padding:24px 18px 48px}
.wrap.one{grid-template-columns:minmax(0,1fr);max-width:960px}.one aside{display:none}
aside{position:sticky;top:calc(var(--h) + env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - 120px);overflow:auto;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px}
aside a{display:block;color:var(--mt);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:15px;transition:.2s}
aside a:hover{color:var(--tx);background:var(--d)}
aside a.on{background:var(--p);color:#fff;font-weight:600}
summary{cursor:pointer}summary a{display:inline-block;width:calc(100% - 4px)}
details>.sub{margin-left:12px;border-left:2px solid var(--d);padding-left:6px}
#bc{font-size:14px;color:var(--mt);margin-bottom:14px}#bc a{color:var(--ac);text-decoration:none}#bc a:hover{text-decoration:underline}#bc b{color:var(--tx);font-weight:500}
main{animation:fade .45s both}
h1.pt{font-size:28px;line-height:1.25;margin:0 0 18px;font-weight:700}
.card{background:var(--cd);border:1px solid var(--ln);border-left:4px solid var(--p);border-radius:10px;padding:20px 24px;margin:0 0 18px}
.card h2{margin:0 0 10px;font-size:18px;font-weight:600;color:var(--ac)}
.mt{color:var(--mt);font-size:15px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:0 0 18px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:18px 20px;transition:border-color .2s,transform .2s,background .2s}
.tile:hover{border-color:var(--p);background:#241014;transform:translateY(-2px)}
.tile h3{margin:0 0 4px;font-size:17px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#FFC9CB;background:rgba(196,30,42,.22);border:1px solid rgba(196,30,42,.6);border-radius:20px;padding:4px 14px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:pulse 1.8s ease-in-out infinite}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:32px;padding:34px 30px;margin:0 0 18px;border-radius:12px;background:linear-gradient(120deg,var(--d),#2b0a10 70%);border:1px solid rgba(196,30,42,.45)}
.hero .lg{width:150px;height:150px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both,glow 4s 1s ease-in-out infinite}
.hero .tx>*{animation:rise .6s both}.hero .tx>:nth-child(2){animation-delay:.15s}.hero .tx>:nth-child(3){animation-delay:.3s}.hero .tx>:nth-child(4){animation-delay:.45s}
.hero p{margin:0 0 6px;color:#E6C3C6}.hero .inst{font-size:14px;color:var(--ac);font-weight:600}
.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px);line-height:1.15;font-weight:700}
.btn{display:inline-block;margin:12px 10px 0 0;padding:10px 22px;border-radius:6px;background:var(--p);color:#fff;font-weight:600;text-decoration:none;transition:background .2s}
.btn:hover{background:#E0303C}.btn.alt{background:transparent;border:1px solid var(--ac);color:var(--tx)}.btn.alt:hover{background:rgba(255,138,143,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two .card{margin:0}
.who{display:flex;align-items:center;gap:18px}.ph{width:112px;height:134px;object-fit:cover;border-radius:8px;border:2px solid var(--p);flex:none;animation:rise .7s .3s both}
dl{margin:0;display:grid;grid-template-columns:70px 1fr;gap:6px 12px}dt{color:var(--mt)}dd{margin:0;font-weight:500}
.wrap.one .tiles{margin-top:18px}
footer{text-align:center;color:var(--mt);font-size:13px;padding:22px 18px calc(24px);border-top:1px solid var(--ln)}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,80,90,.45)}}@keyframes pulse{50%{opacity:.25}}
@media(max-width:899px){.wrap{grid-template-columns:minmax(0,1fr)}#hb{display:block}aside{position:fixed;z-index:25;top:calc(var(--h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:80%;max-width:300px;max-height:none;border-radius:0 10px 10px 0;transform:translateX(-105%);transition:transform .3s}aside.open{transform:none}.one aside{display:block}.top a{padding:6px 8px;font-size:14px}.two{grid-template-columns:1fr}}
@media(max-width:560px){.brand span{display:none}.hero{padding:26px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const home=()=>`<section class="hero"><img class="lg" src="${LOGO}" alt="KLE Tech logo"><div class="tx"><p class="inst">KLE Technological University, Hubballi</p><h1>Digital Electronics Portfolio</h1><p>A record of the TWSL laboratory work and theory units for the Digital Electronics course.</p><div><a class="btn" href="#/lab">TWSL Lab</a><a class="btn alt" href="#/theory">TWSL Theory</a></div></div></section>

function page(n){const k=n.id;if(k=='home')return home();

if(!n.ch)return h+`<section class="card">${tag}<p style="margin:14px 0 6px">The content for this page has not been uploaded yet.</p><p class="mt">Planned: ${PLAN[k]}.</p></section>`;
return h+tiles(n.ch)+(/^c\d$/.test(k)?`<p class="mt">Chapter content is yet to be uploaded.</p>`:'')}
const nav=(a,c)=>a.map(n=>n.ch?`<details${c.startsWith(n.path)?' open':''}><summary><a href="#/${n.path}" class="${c==n.path?'on':''}">${n.t}</a></summary><div class="sub">${nav(n.ch,c)}</div></details>`:`<a href="#/${n.path}" class="${c==n.path?'on':''}">${n.t}</a>`).join('');

for(let x=n;x;x=x.par)b.unshift(x);if(n.id!='home')b.unshift(X.home);
